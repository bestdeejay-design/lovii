<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b0d10;
    --bg-2: #161a20;
    --ink: #f5f6fa;
    --muted: #8a8f9c;
    --line: #232834;
    --teal: #00c9b7;
    --teal-deep: #009e90;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .hero {
    width: 100%; height: 100%;
    background:
      radial-gradient(90% 70% at 78% 12%, rgba(0, 201, 183, .10), transparent 55%),
      linear-gradient(165deg, var(--bg-2) 0%, var(--bg) 100%);
    color: var(--ink);
    padding: 40pt;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .logo { height: 34pt; width: auto; margin-bottom: 26pt; align-self: flex-start; }
  .badge {
    display: inline-flex; align-self: flex-start;
    font-size: 11pt; font-weight: 600; letter-spacing: .04em;
    color: var(--teal);
    border: 1px solid rgba(0, 201, 183, .45);
    border-radius: 999px;
    padding: 5pt 14pt;
    margin-bottom: 16pt;
  }
  h1 {
    font-size: 52pt; line-height: 1.05;
    font-weight: 800; letter-spacing: -.015em;
    margin-bottom: 16pt;
  }
  h1 span { color: var(--teal); }
  .sub {
    font-size: 15pt; line-height: 1.5;
    color: var(--muted);
    max-width: 88ch;
    margin-bottom: 24pt;
  }
  .sub strong { color: var(--ink); font-weight: 600; }
  .meta {
    display: flex; gap: 12pt; align-items: center;
    font-size: 11.5pt; color: var(--muted);
  }
  .meta b { color: var(--ink); font-weight: 600; }
  .meta .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--teal-deep); }
</style>
</head>
<body>
<section class="hero">
  <img class="logo" src="img/logos/lovii-logo_dark.svg" alt="LOVII">
  <span class="badge">White Paper v1.23</span>
  <h1>LOVII — <span>от района к Федерации</span></h1>
  <p class="sub">White-label &amp; SaaS-платформа для создания и масштабирования <strong>локальных маркетплейсов</strong> для микро- и малого бизнеса в отдельно взятом пространстве, фуд-корте, торговом центре, районе или городе.</p>
  <div class="meta">
    <span>Дата: <b>август 2026</b></span>
    <span class="dot"></span>
    <span>Статус: <b>MVP</b></span>
    <span class="dot"></span>
    <span>ООО «Аксиома»</span>
  </div>
</section>
</body>
</html>
